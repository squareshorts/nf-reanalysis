[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nf-reanalysis"
version = "2.0.0"
description = "Reproducible aggregate analysis for an occupational SMR neurofeedback resting-state EEG study"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.3.3",
  "scipy==1.15.3",
  "scikit-learn==1.7.2",
  "matplotlib==3.10.8",
  "pingouin>=0.5.5,<0.6",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
